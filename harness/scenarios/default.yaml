# Default scenario: runs couple failure modes together against one coordinator.

providers:
  - name: node-a100-1
    behavior: normal
    capabilities: { gpu_model: A100, vram_mb: 40960, driver: "535.104", runtimes: [cuda12, cuda11, pytorch2] }
    tiers: [standard, premium]

  - name: node-a100-2
    behavior: normal
    capabilities: { gpu_model: A100, vram_mb: 40960, driver: "535.104", runtimes: [cuda12, cuda11] }
    tiers: [standard, premium]

  - name: node-3090-vanishes
    behavior: disappear
    capabilities: { gpu_model: RTX3090, vram_mb: 24576, driver: "535.104", runtimes: [cuda12] }
    tiers: [standard]

  - name: node-liar
    behavior: capability_lie
    capabilities: { gpu_model: RTX2060, vram_mb: 32768, driver: "510.47", runtimes: [cuda11] }
    tiers: [standard]
    actual_vram_mb: 6144

jobs:
  - { tier: standard, min_vram_mb: 8192,  artifact_required: true,  count: 3, required_runtime: "cuda12", gpu_models: [] }
  - { tier: premium,  min_vram_mb: 32768, artifact_required: false, count: 1, required_runtime: "cuda12", gpu_models: ["A100"] }
  - { tier: standard, min_vram_mb: 8192,  artifact_required: false, count: 2, required_runtime: "cuda11", gpu_models: [] }
