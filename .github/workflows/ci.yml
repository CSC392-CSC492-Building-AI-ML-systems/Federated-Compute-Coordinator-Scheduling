# CI
# when PR is open, run automated workflow to test if things developed before are broken :)
#
# Two independent jobs, one per team, so a failure points at the right owner:
# - coordinator: everything except the Harness area.
# - harness:     harness/ and tests/test_harness_*.py (owned by the Harness team).
# Both jobs run the same pre-commit hooks and pytest, only on their own files.
# Name new Harness tests tests/test_harness_*.py so they land in the right job.
name: Coordinator scaffold CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coordinator:
    name: Coordinator checks (not feature validation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pre-commit checks (non-Harness files)
        run: >-
          git ls-files -z -- . ':!:harness' ':!:tests/test_harness_*'
          | xargs -0 -r python -m pre_commit run --files
      - name: Run Coordinator tests
        run: python -m pytest tests/ -v --ignore-glob='tests/test_harness_*'

  harness:
    name: Harness checks (not feature validation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pre-commit checks (Harness files)
        run: >-
          git ls-files -z -- harness 'tests/test_harness_*'
          | xargs -0 -r python -m pre_commit run --files
      - name: Run Harness tests
        run: python -m pytest tests/test_harness_*.py -v
