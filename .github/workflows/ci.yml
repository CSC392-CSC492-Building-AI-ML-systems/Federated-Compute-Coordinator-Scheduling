# CI
# when PR is open, run automated workflow to test if things developed before are broken :)
name: Coordinator scaffold CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Scaffold checks (not feature validation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pre-commit checks
        run: python -m pre_commit run --all-files
      - name: Run current tests (scaffold only for now)
        run: python -m pytest tests/ -v
